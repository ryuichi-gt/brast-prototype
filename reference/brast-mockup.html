<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BRAST — Brand Strategy OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BRAST — Brand Strategy OS
   Concept: "The Briefing Room"
   A dark situation-room console (the desk) on which a warm
   paper presentation deck floats. The AI is an autonomous
   media operator that presents a weekly strategy briefing
   to you, its supervisor. Color encodes the human/AI boundary:
     teal   = the AI's autonomous / live work
     amber  = where YOUR decision is required
   ============================================================ */

:root{
  /* situation-room ink */
  --ink:#0C111B;
  --ink-1:#101724;
  --ink-2:#141E2E;
  --ink-3:#1B2839;
  --line:#26344A;
  --line-soft:#1d2a3c;

  /* warm paper deck */
  --paper:#F6F2E9;
  --paper-2:#FBF8F1;
  --paper-line:#E2DACB;
  --paper-ink:#1A1E26;
  --paper-mut:#6A6F7B;
  --paper-faint:#9aa0ab;

  /* signals */
  --signal:#46CBBE;     /* AI / live / automated */
  --signal-dim:#2a8a82;
  --amber:#E6A53B;      /* needs your decision */
  --amber-deep:#c9892a;
  --rose:#E0775F;       /* risk / flagged */
  --ok:#5FB97E;         /* approved / live */

  /* text on dark */
  --t-hi:#EEF2F8;
  --t-md:#A5AEBF;
  --t-lo:#6C7689;

  --r:14px;
  --r-sm:9px;
  --rail:236px;
  --pipe:300px;

  --shadow-deck:0 28px 60px -22px rgba(0,0,0,.66), 0 4px 14px -6px rgba(0,0,0,.5);
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --disp:"Space Grotesk","Noto Sans JP",sans-serif;
  --jp:"Noto Sans JP","Space Grotesk",sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--jp);
  background:
    radial-gradient(1200px 700px at 78% -8%, rgba(70,203,190,.07), transparent 60%),
    radial-gradient(900px 600px at 8% 110%, rgba(230,165,59,.05), transparent 55%),
    var(--ink);
  color:var(--t-hi);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-size:14px;
  line-height:1.55;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eye{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--t-lo)}
.pipehead .t svg,.opsbox .row svg,.crumb svg,.viewcfg svg{width:14px;height:14px;flex:none}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns:var(--rail) 1fr;
  min-height:100vh;
}

/* ---------- Left rail ---------- */
.rail{
  background:linear-gradient(180deg,var(--ink-1),var(--ink));
  border-right:1px solid var(--line-soft);
  display:flex;flex-direction:column;
  padding:18px 14px;
  gap:6px;
  position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:conic-gradient(from 210deg,var(--signal),#7fe4d9 40%,var(--amber) 75%,var(--signal));
  position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 6px 16px -6px rgba(70,203,190,.6);
}
.brand .mark::after{content:"";position:absolute;inset:6px;border-radius:5px;background:var(--ink-1)}
.brand .mark::before{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--signal);transform:translate(-50%,-50%);box-shadow:0 0 10px 2px var(--signal)}
.brand .name{font-family:var(--disp);font-weight:700;letter-spacing:.16em;font-size:15px}
.brand .sub{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--t-lo);margin-top:-2px}

.tenant{
  background:var(--ink-2);border:1px solid var(--line);border-radius:11px;
  padding:9px 10px;margin-bottom:8px;cursor:pointer;position:relative;
}
.tenant:hover{border-color:var(--signal-dim)}
.tenant .tlabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--t-lo)}
.tenant .tname{font-weight:700;font-size:13px;margin-top:2px;position:relative;padding-right:18px;line-height:1.3}
.tenant .tname svg{position:absolute;right:0;top:3px;width:14px;height:14px;color:var(--t-lo)}
.chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
  padding:3px 8px;border-radius:20px;border:1px solid var(--line);
  color:var(--t-md);background:#0e1622;
}
.chip.on{background:rgba(70,203,190,.13);border-color:var(--signal-dim);color:#bdeee8}

.navlabel{font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--t-lo);padding:14px 8px 6px}
.nav{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
.nav button{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:10px;color:var(--t-md);
  font-size:13.5px;font-weight:500;text-align:left;width:100%;
  transition:background .15s,color .15s;
}
.nav button svg{width:17px;height:17px;flex:none;opacity:.85}
.nav button:hover{background:var(--ink-2);color:var(--t-hi)}
.nav button.active{background:linear-gradient(90deg,rgba(70,203,190,.16),rgba(70,203,190,.02));color:#fff}
.nav button.active svg{color:var(--signal);opacity:1}
.nav button .badge{margin-left:auto;font-family:var(--mono);font-size:9.5px;background:var(--amber);color:#1c1303;padding:1px 6px;border-radius:9px;font-weight:600}
.nav .sep{height:1px;background:var(--line-soft);margin:8px 6px}

.railfoot{margin-top:auto;padding-top:12px}
.opsbox{background:var(--ink-2);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.opsbox .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--t-md)}
.opsbox .row + .row{margin-top:7px}
.live{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 0 rgba(70,203,190,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(70,203,190,.5)}70%{box-shadow:0 0 0 7px rgba(70,203,190,0)}100%{box-shadow:0 0 0 0 rgba(70,203,190,0)}}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(16,23,36,.96),rgba(12,17,27,.9));
  backdrop-filter:blur(6px);flex:none;
  position:sticky;top:0;z-index:30;
}
.crumb{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--t-md)}
.crumb b{color:var(--t-hi);font-weight:700}
.crumb .slash{color:var(--t-lo)}
.topbar .grow{flex:1}
.weekpill{
  display:flex;align-items:center;gap:9px;padding:6px 13px;border-radius:30px;
  background:var(--ink-2);border:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--t-md)
}
.weekpill b{color:var(--t-hi)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;
  transition:transform .1s, filter .15s, background .15s;
}
.btn:active{transform:translateY(1px)}
.btn-amber{background:linear-gradient(180deg,#efb352,var(--amber));color:#221703;box-shadow:0 8px 20px -8px rgba(230,165,59,.6)}
.btn-amber:hover{filter:brightness(1.05)}
.btn-ghost{border:1px solid var(--line);color:var(--t-md)}
.btn-ghost:hover{border-color:var(--signal-dim);color:var(--t-hi)}
.btn-teal{background:rgba(70,203,190,.14);border:1px solid var(--signal-dim);color:#bdeee8}
.btn-teal:hover{background:rgba(70,203,190,.22)}

.scroll{min-width:0}
.view{display:none}
.view.show{display:block}

/* =======================================================
   BRIEFING — the hero: paper deck on the dark desk
   ======================================================= */
.briefing{
  display:grid;
  grid-template-columns:1fr var(--pipe);
  gap:0;align-items:start;
}
.deckwrap{
  padding:26px 30px 22px;display:flex;flex-direction:column;
}
.deckhead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.deckhead h1{
  font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.01em;margin:0;
  display:flex;align-items:baseline;gap:11px;
}
.deckhead h1 .jp{font-family:var(--jp)}
.aitag{
  display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.08em;padding:5px 11px;border-radius:30px;
  background:rgba(70,203,190,.1);border:1px solid var(--signal-dim);color:#a7e9e1;
}
.aitag .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal)}

/* the deck (paper) */
.deck{
  background:var(--paper);
  color:var(--paper-ink);
  border-radius:16px;
  box-shadow:var(--shadow-deck);
  position:relative;overflow:hidden;
  min-height:clamp(440px,58vh,640px);
  display:flex;flex-direction:column;
  background-image:radial-gradient(rgba(0,0,0,.018) 1px,transparent 1px);
  background-size:4px 4px;
}
.deck::before{ /* warm top sheen + binding edge */
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--signal),var(--amber));opacity:.85;
}
.slide{position:relative;padding:34px 40px 38px;display:none;flex-direction:column}
.slide.show{display:flex;flex:1 1 auto;animation:slidein .35s cubic-bezier(.2,.7,.2,1)}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.slide .skicker{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.slide .snum{font-family:var(--mono);font-size:11px;color:var(--paper-faint);letter-spacing:.1em}
.slide .seye{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--signal-dim);font-weight:600}
.slide h2{font-size:25px;font-weight:900;line-height:1.25;margin:0 0 4px;letter-spacing:-.01em;color:#15181f;max-width:34ch}
.slide .lead{font-size:15px;color:#3a3f49;max-width:62ch;margin:6px 0 18px;line-height:1.7}
.slide .lead b{color:#15181f}
.flagwrap{position:absolute;top:26px;right:30px;display:flex;gap:8px}
.flagbtn{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:6px 12px;border-radius:9px;border:1px solid var(--paper-line);color:var(--paper-mut);background:#fff;
}
.flagbtn:hover{border-color:var(--amber);color:var(--amber-deep)}
.flagbtn.flagged{background:rgba(230,165,59,.13);border-color:var(--amber);color:var(--amber-deep)}
.slide .own{position:absolute;bottom:18px;right:32px;font-family:var(--mono);font-size:10px;color:var(--paper-faint);letter-spacing:.04em}
.slide .own b{color:var(--signal-dim)}

/* summary slide */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 22px}
.kpi{background:var(--paper-2);border:1px solid var(--paper-line);border-radius:12px;padding:15px 16px}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:27px;line-height:1;color:#15181f}
.kpi .v small{font-size:13px;color:var(--paper-mut);font-weight:500;margin-left:3px}
.kpi .l{font-size:11.5px;color:var(--paper-mut);margin-top:7px}
.kpi .d{font-family:var(--mono);font-size:10px;margin-top:4px}
.kpi .d.up{color:#2f9c5d}.kpi .d.warn{color:var(--amber-deep)}

.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:auto}
.track{border:1px solid var(--paper-line);border-radius:12px;padding:16px 17px;background:#fff;position:relative;overflow:hidden}
.track::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.track.steady::before{background:var(--signal)}
.track.camp::before{background:var(--amber)}
.track .tt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.track .tt .tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:20px}
.track.steady .tt .tag{background:rgba(70,203,190,.14);color:var(--signal-dim)}
.track.camp .tt .tag{background:rgba(230,165,59,.16);color:var(--amber-deep)}
.track p{font-size:12.5px;color:#4a505b;margin:8px 0 0;line-height:1.6}
.track .meta{display:flex;gap:14px;margin-top:11px;font-family:var(--mono);font-size:10.5px;color:var(--paper-mut)}
.track .meta b{color:#15181f}

/* reasoning chain (strategy slide) */
.reason{display:flex;flex-direction:column;gap:0;margin:4px 0 0}
.rnode{display:grid;grid-template-columns:148px 1fr;gap:16px;padding:13px 0;border-top:1px solid var(--paper-line);align-items:start}
.rnode:first-child{border-top:none}
.rnode .who{display:flex;align-items:center;gap:9px}
.rnode .who .ag{width:9px;height:9px;border-radius:2px;background:var(--signal);transform:rotate(45deg);flex:none}
.rnode .who .nm{font-weight:700;font-size:12.5px}
.rnode .who .role{font-family:var(--mono);font-size:9.5px;color:var(--paper-faint)}
.rnode .says{font-size:13px;color:#3a3f49;line-height:1.65}
.rnode.synth{background:linear-gradient(90deg,rgba(230,165,59,.08),transparent);border-radius:10px;padding:14px 12px;border-top:none;margin-top:4px}
.rnode.synth .who .ag{background:var(--amber);border-radius:50%;transform:none}
.rnode.synth .says{color:#2a2e36;font-weight:500}

/* trend signals (market slide) */
.signals{display:flex;flex-direction:column;gap:10px}
.sig{display:grid;grid-template-columns:46px 1fr auto;gap:15px;align-items:center;border:1px solid var(--paper-line);border-radius:11px;padding:12px 15px;background:#fff}
.sig .score{font-family:var(--disp);font-weight:700;font-size:20px;text-align:center;color:var(--signal-dim);line-height:1}
.sig .score small{display:block;font-size:8px;font-family:var(--mono);color:var(--paper-faint);font-weight:400;letter-spacing:.1em}
.sig .body .h{font-weight:700;font-size:13.5px;color:#15181f}
.sig .body .src{font-family:var(--mono);font-size:10px;color:var(--paper-faint);margin-top:3px}
.sig .delta{font-family:var(--mono);font-size:12px;color:#2f9c5d;font-weight:600;white-space:nowrap}
.sig .delta.hot{color:var(--rose)}
.sigfoot{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:11.5px;color:var(--paper-mut)}
.sigfoot .live{background:var(--signal-dim)}

/* knowledge slide */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.kcard{border:1px solid var(--paper-line);border-radius:11px;padding:13px 15px;background:#fff}
.kcard .kh{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:13px}
.kcard .kst{font-family:var(--mono);font-size:9.5px;padding:2px 8px;border-radius:20px}
.kst.fresh{background:rgba(95,185,126,.16);color:#2f9c5d}
.kst.stale{background:rgba(230,165,59,.16);color:var(--amber-deep)}
.kcard ul{margin:9px 0 0;padding-left:16px;font-size:12px;color:#4a505b;line-height:1.7}
.kcard li::marker{color:var(--signal-dim)}

/* media plan slide -> list of pieces */
.pieces{display:flex;flex-direction:column;gap:9px}
.piece{display:grid;grid-template-columns:1fr auto;gap:12px;border:1px solid var(--paper-line);border-radius:11px;padding:12px 15px;background:#fff;align-items:center}
.piece .pl .pt{font-weight:700;font-size:13.5px;color:#15181f}
.piece .pl .pm{display:flex;gap:9px;margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--paper-mut);flex-wrap:wrap}
.piece .pl .pm .ch{padding:1px 7px;border-radius:20px;border:1px solid var(--paper-line)}
.piece .pr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.scorepill{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:8px}
.scorepill.pass{background:rgba(95,185,126,.15);color:#2f9c5d}
.scorepill.review{background:rgba(230,165,59,.16);color:var(--amber-deep)}
.scorepill.gen{background:rgba(70,203,190,.14);color:var(--signal-dim)}
.verbadge{font-family:var(--mono);font-size:9px;color:var(--paper-faint)}

/* schedule slide */
.cal{display:grid;grid-template-columns:96px repeat(7,1fr);border:1px solid var(--paper-line);border-radius:12px;overflow:hidden;background:#fff;font-size:11px}
.cal .hd{background:var(--paper-2);font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--paper-mut);padding:9px 6px;text-align:center;border-bottom:1px solid var(--paper-line)}
.cal .ch{background:var(--paper-2);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--paper-line);border-right:1px solid var(--paper-line);color:#15181f;font-size:11px;display:flex;align-items:center;gap:6px}
.cal .ch .auto{width:6px;height:6px;border-radius:50%;background:var(--signal)}
.cal .ch .man{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.cal .cell{min-height:46px;border-bottom:1px solid var(--paper-line);border-right:1px solid var(--paper-line);padding:5px;display:flex;flex-direction:column;gap:3px}
.cal .ev{font-size:9.5px;line-height:1.3;border-radius:6px;padding:4px 6px;font-weight:500}
.cal .ev.t{background:rgba(70,203,190,.16);color:#1c6a63}
.cal .ev.a{background:rgba(230,165,59,.2);color:var(--amber-deep)}
.callegend{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--paper-mut);align-items:center}
.callegend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

/* deck footer / slide rail */
.deckrail{display:flex;align-items:center;gap:10px;padding:14px 4px 22px}
.navarrow{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);color:var(--t-md);display:grid;place-items:center}
.navarrow:hover{border-color:var(--signal-dim);color:var(--t-hi)}
.dots{display:flex;gap:7px;flex:1;overflow:auto}
.dotseg{flex:1;min-width:34px;display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:2px 0}
.dotseg .bar{height:3px;border-radius:3px;background:var(--line)}
.dotseg.done .bar{background:var(--signal-dim)}
.dotseg.active .bar{background:var(--signal)}
.dotseg .lab{font-family:var(--mono);font-size:9px;color:var(--t-lo);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dotseg.active .lab{color:var(--t-hi)}

/* ---------- Pipeline rail (right) ---------- */
.pipe{
  border-left:1px solid var(--line-soft);background:linear-gradient(180deg,var(--ink-1),var(--ink));
  display:flex;flex-direction:column;
}
.pipehead{padding:20px 20px 12px;border-bottom:1px solid var(--line-soft)}
.pipehead .t{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.pipehead .s{font-size:11px;color:var(--t-lo);margin-top:3px;line-height:1.5}
.pipeline{padding:14px 20px;position:relative}
.pnode{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:14px}
.pnode .gut{display:flex;flex-direction:column;align-items:center}
.pnode .nd{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);background:var(--ink-2);z-index:1;margin-top:3px;flex:none;transition:.2s}
.pnode .ln{width:2px;flex:1;background:var(--line-soft);margin-top:2px}
.pnode:last-child .ln{display:none}
.pnode.done .nd{border-color:var(--signal);background:var(--signal)}
.pnode.you .nd{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 4px rgba(230,165,59,.18)}
.pnode.pending .nd{opacity:.6}
.pnode .pbody .pn{font-weight:600;font-size:12.5px}
.pnode .pbody .pd{font-size:10.5px;color:var(--t-lo);margin-top:2px;line-height:1.45}
.pnode .pbody .pmeta{font-family:var(--mono);font-size:9.5px;color:var(--signal-dim);margin-top:4px}
.pnode.you .pbody .pmeta{color:var(--amber)}
.pnode.trace .nd{box-shadow:0 0 0 5px rgba(230,165,59,.22);border-color:var(--amber);background:var(--amber)}
.pnode.trace .ln{background:linear-gradient(180deg,var(--amber),var(--line-soft))}

// which slide-trace maps to which downstream pipeline nodes
const TRACE_ORDER=['know','trend','strat','gen','img','review','score','you','dist'];
function traceContains(nodeKey){
  if(!state.traceKey) return false;
  const start=TRACE_ORDER.indexOf(state.traceKey);
  const here=TRACE_ORDER.indexOf(nodeKey);
  return here>=start && here<=TRACE_ORDER.indexOf('score');
}
function traceMessage(key){
  const map={
    know:['ナレッジ更新','ナレッジを更新すると、トレンド〜戦略〜生成まで全工程を作り直します'],
    trend:['トレンド調査','調査をやり直し、戦略・コンテンツ・スコアまで下流6工程を再実行します'],
    strat:['戦略統合','戦略から作り直し、生成・画像・レビュー・スコアの下流5工程を再実行します'],
    gen:['コンテンツ生成','この記事だけ再生成し、画像・レビュー・スコアを通し直します'],
    dist:['配信','配信のチャネル割り当て・スケジュールのみ調整します（生成はやり直しません）'],
  };
  const m=map[key]||map.strat;
  return `<b>${m[0]}</b> の仕事に差し戻します。${m[1]}。<br>既に承認済みの記事は残したまま進められます。 <b style="cursor:pointer;text-decoration:underline" id="rerun">ここから再実行 ▸</b>`;
}

    {c:'var(--signal)',n:'戦略統合',r:'Strategy Orchestrator',d:'市場・競合エージェントの結論を統合し、定常発信とキャンペーンの2トラックで週次戦略を決定する。',cfg:['統合元: 市場/競合','出力: 戦略シート','トラック: 定常 + キャンペーン']},
    {c:'var(--signal)',n:'コンテンツ生成',r:'Content',d:'戦略に紐づけて記事・SNS草稿を生成。媒体ごとに文量とトーンを出し分ける。',cfg:['媒体別フォーマット','トーン: ナレッジ準拠','出力: 記事 / SNS / 配布資料']},
    {c:'var(--signal)',n:'画像生成',r:'Visual',d:'各記事のキービジュアルを生成。ブランドのビジュアルトーンに準拠する。',cfg:['出力: キービジュアル','準拠: ブランドトーン']},
    {gate:true,c:'var(--amber)',n:'多段レビュー（4体）',r:'Review Cluster',d:'4体の審査エージェントが並列で審査。1つでも基準未達なら生成工程へ戻す。',cfg:['AIライティング検知','法務・景表法','レピュテーション','IR・専門']},
    {gate:true,c:'var(--amber)',n:'スコアリング & ゲート',r:'Score Gate',d:'審査結果を統合し95点しきい値で判定。基準超なら原則そのまま、未満はあなたのレビューを推奨。',cfg:['しきい値: 95 / 100','超過: 自動承認候補','未満: 人間レビュー推奨']},
  ];
  return `<div class="page">
    <div class="pagehead"><h1>エージェント</h1>
      <p>裏側のオーケストレーションです。構成はこちらで用意し、あなたは中身を確認できます（編集は不可、選んで使う設計）。審査ゲートを通った成果だけが、あなたのレビューに上がります。</p></div>
    <div class="sectlabel">Orchestration Pipeline · Agent SDK</div>
    ${order.map(a=>`<div class="agentrow">
      <div class="agut"><div class="ad" style="background:${a.c}"></div><div class="al"></div></div>
      <div class="acard ${a.gate?'gate':''}"><div class="ahead">
        <div class="an" style="${a.gate?'color:var(--amber)':''}">${a.n}</div>
        <div class="arole">${a.r}</div></div>
        <p>${a.d}</p>
        <div class="cfg">${a.cfg.map(c=>`<span class="c">${c}</span>`).join('')}</div>
        <span class="viewcfg" role="button" tabindex="0" data-toast="設定の中身を表示（編集は不可）">${svg(I.chev,'')} 設定の中身を見る</span>
      </div></div>`).join('')}
    </div>`;
}

/* ============================================================
   SHELL + RENDER
   ============================================================ */
function shell(){
  const t=TENANTS[state.tenant];
  const railNav=NAV.map(n=>n.sep?'<div class="sep"></div>':
    `<button class="${state.view===n.id?'active':''}" data-nav="${n.id}">${svg(n.icon)}<span>${n.label}</span>${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>`).join('');

  const tenantBox=`<div class="tenant" id="tenantbtn">
      <div class="tlabel">TENANT</div>
      <div class="tname">${t.name} ${svg(I.chev)}</div>
      <div style="font-size:11px;color:var(--t-lo);margin-top:1px">${t.unit}</div>
      <div class="chips">${t.channels.map((c,i)=>`<span class="chip ${i===0?'on':''}">${c}</span>`).join('')}</div>
    </div>`;

  let body='';
  switch(state.view){
    case 'briefing': body=briefingView(); break;
    case 'strategy': body=strategyView(); break;
    case 'trends': body=trendsView(); break;
    case 'knowledge': body=knowledgeView(); break;
    case 'content': body=contentView(); break;
    case 'channels': body=channelsView(); break;
    case 'agents': body=agentsView(); break;
  }
  const isBrief=state.view==='briefing';
  const topRight=isBrief
    ? `<div class="weekpill"><span class="live" style="width:7px;height:7px;border-radius:50%;background:var(--signal)"></span>2026 W25 · <b>6/16</b> 週</div>
       <button class="btn btn-ghost" id="topfb">差し戻す</button>
       <button class="btn btn-amber" id="approve">このブリーフィングを承認して実行</button>`
    : `<div class="weekpill mono">医療ITソリューション</div>`;

  document.getElementById('app').innerHTML=`
    <aside class="rail">
      <div class="brand"><div class="mark"></div><div><div class="name">BRAST</div><div class="sub">BRAND STRATEGY OS</div></div></div>
      ${tenantBox}
      <div class="navlabel">OPERATIONS</div>
      <nav class="nav">${railNav}</nav>
      <div class="railfoot"><div class="opsbox">
        <div class="row"><span class="live"></span> 自走モード：稼働中</div>
        <div class="row" style="color:var(--t-lo)">${svg(I.spark,'')}&nbsp;次回ブリーフィング：来週月 06:00</div>
        <div class="row" style="color:var(--t-lo)">Slackに日次レポート送信中</div>
      </div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb"><b>${t.name}</b><span class="slash">/</span>${t.unit}<span class="slash">/</span>${NAV.find(n=>n.id===state.view)?.label||''}</div>
        <div class="grow"></div>
        ${topRight}
      </header>
      <div class="scroll">${body}</div>
    </main>`;
  bind();
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg,amber=false){
  const el=document.getElementById('toast');
  document.getElementById('toastmsg').textContent=msg;
  el.classList.toggle('amber',amber);
  el.querySelector('.ti').textContent=amber?'!':'✓';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

/* ---------- bindings ---------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;state.traceKey=null;shell();});

  const tb=document.getElementById('tenantbtn');
  if(tb) tb.onclick=()=>{ state.tenant=(state.tenant+1)%TENANTS.length; state.slide=0; toast(`テナントを「${TENANTS[state.tenant].name}」に切り替えました`); shell(); };

  // toast-only affordances
  document.querySelectorAll('[data-toast]').forEach(b=>{
    b.onclick=()=>toast(b.dataset.toast);
    b.onkeydown=(e)=>{if(e.key==='Enter')toast(b.dataset.toast);};
  });

  if(state.view!=='briefing') return;

  // slide nav
  const go=(i)=>{ state.slide=Math.max(0,Math.min(SLIDES.length-1,i)); renderSlides(); };
  document.getElementById('prev').onclick=()=>go(state.slide-1);
  document.getElementById('next').onclick=()=>go(state.slide+1);
  document.querySelectorAll('[data-goto]').forEach(d=>d.onclick=()=>go(+d.dataset.goto));

  // flag a slide -> trace back
  document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.flag;
    const slide=SLIDES.find(s=>s.key===key);
    state.flagged[key]=!state.flagged[key];
    state.traceKey=state.flagged[key]?slide.trace:null;
    shell();
    if(state.flagged[key]){
      toast(`「${slide.eye}」を差し戻し。原因の工程を表示しました`,true);
      setTimeout(bindRerun,30);
    }
  });

  // quick feedback chips
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{
    state.traceKey=b.dataset.q; shell(); setTimeout(bindRerun,30);
    toast('指示を受け付けました。該当工程まで遡ります',true);
  });

  // feedback text input
  const send=()=>{
    const v=document.getElementById('fbinput').value.trim();
    if(!v) return;
    // naive intent routing for the demo
    let key='strat';
    if(/トレンド|調査|市場|ニュース/.test(v)) key='trend';
    else if(/ナレッジ|前提|情報更新/.test(v)) key='know';
    else if(/記事|生成|文章|画像/.test(v)) key='gen';
    else if(/配信|スケジュール|チャネル|投稿/.test(v)) key='dist';
    state.traceKey=key; shell(); setTimeout(bindRerun,30);
    toast('フィードバックを受け付け、原因工程まで遡りました',true);
  };
  document.getElementById('fbsend').onclick=send;
  document.getElementById('fbinput').onkeydown=(e)=>{if(e.key==='Enter')send();};

  // approve / reject in topbar
  const ap=document.getElementById('approve');
  if(ap) ap.onclick=()=>{
    PIPE[7].state='done'; PIPE[7].meta='承認済み'; PIPE[8].state='done'; PIPE[8].meta='配信を起動';
    state.traceKey=null;
    shell();
    toast('承認しました。今週分の配信を自動で実行します');
  };
  const rj=document.getElementById('topfb');
  if(rj) rj.onclick=()=>{ document.getElementById('fbinput')?.focus(); };

  bindRerun();
}
function bindRerun(){
  const r=document.getElementById('rerun');
  if(r) r.onclick=()=>{
    const k=state.traceKey; state.traceKey=null; state.flagged={};
    shell();
    toast('該当工程から下流を再実行しました。新しい案をプレゼンに反映します');
  };
}

// re-render only slide area + pipeline state without full shell rebuild
function renderSlides(){
  document.querySelectorAll('.slide').forEach((el)=>{
    el.classList.toggle('show', +el.dataset.slide===state.slide);
  });
  document.querySelectorAll('.dotseg').forEach((el,i)=>{
    el.classList.toggle('done', i<state.slide);
    el.classList.toggle('active', i===state.slide);
  });
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',(e)=>{
  if(state.view!=='briefing') return;
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){state.slide=Math.min(SLIDES.length-1,state.slide+1);renderSlides();}
  if(e.key==='ArrowLeft'){state.slide=Math.max(0,state.slide-1);renderSlides();}
});

shell();

</script>
</body>
</html>
